name: Explorex Continuous Integration & Quality Suite

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-gate:
    name: Lint, Integrity Audits, Tests & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Setup Node.js Runtime
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Code Quality & Linting (oxlint)
        run: npm run lint

      - name: Image Integrity Audit (No Duplicate Hashes)
        run: npm run check:images

      - name: Comprehensive Data & Boundary Verification
        run: npm run check:data

      - name: Unit & Integration Test Suite
        run: npm test

      - name: Production Vite Build
        run: npm run build
        env:
          VITE_BASE_PATH: /Explorex/

      - name: Install Playwright Chromium Browser
        run: npx playwright install --with-deps chromium

      - name: Start Servers and Run End-to-End Test Suite (9 Core User Flows)
        env:
          BASE_URL: http://localhost:5180/Explorex/
          VITE_BASE_PATH: /Explorex/
        run: |
          npm run server &
          npx wait-on http://localhost:5005/api/health --timeout 30000
          npm run preview -- --port 5180 --host &
          npx wait-on http://localhost:5180/Explorex/ --timeout 30000
          npm run test:e2e
